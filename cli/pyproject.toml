[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walkie-aioc"
version = "0.1.0"
description = "AIOC radio audio and PTT control"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5,<4", "sounddevice>=0.5,<0.6", "numpy>=1.26,<3", "hidapi>=0.14,<0.16"]

[project.scripts]
aioc = "aioc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
